<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="pill-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    .stat-label {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      fill: #64748b;
    }

    /* Keyframe Animations */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.7; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes circuitFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .animated-orb-1 {
      animation: pulseOrb 9s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .animated-orb-2 {
      animation: pulseOrb 12s ease-in-out infinite reverse;
      transform-origin: 1000px 300px;
    }
    .card-float-1 {
      animation: floatCard 6s ease-in-out infinite;
    }
    .card-float-2 {
      animation: floatCard 7s ease-in-out infinite 1.5s;
    }
    .card-float-3 {
      animation: floatCard 6.5s ease-in-out infinite 0.75s;
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: circuitFlow 4s linear infinite;
    }
    .blinking-dot {
      animation: blinkDot 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />

  <!-- Animated Glowing Orbs behind the scene -->
  <g filter="url(#glow)">
    <circle class="animated-orb-1" cx="220" cy="110" r="140" fill="url(#cyan-glow)" />
    <circle class="animated-orb-2" cx="980" cy="300" r="160" fill="url(#purple-glow)" />
    <circle cx="600" cy="400" r="100" fill="#3b82f6" opacity="0.15" />
  </g>

  <!-- Tech Grid Background -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Circuit Flow Lines (Background) -->
  <g opacity="0.35">
    <path class="flow-line" d="M 50 80 Q 300 40, 600 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="flow-line" d="M 50 360 Q 400 400, 750 350 T 1150 370" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- FOREGROUND LAYER: Content remains distinctly in foreground -->
  <!-- Top Tag / Pill -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <rect x="-185" y="-16" width="370" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#pill-shadow)" />
    <circle cx="-160" cy="0" r="4.5" fill="#10b981" class="blinking-dot" />
    <text x="8" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1.2">CURATED ECOSYSTEM FOR CLOUD TESTING</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <text class="title-text" fill="url(#title-grad)">Awesome Local Cloud Emulation</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 175)" text-anchor="middle">
    <text class="subtitle-text">Test AWS, Azure &amp; GCP APIs offline with zero bills, zero tokens &amp; high speed</text>
  </g>

  <!-- Feature & Architecture Cards (Interactive & Floating) -->
  <g transform="translate(130, 235)">
    <!-- Card 1: AWS Mocking -->
    <g class="card-float-1" transform="translate(0, 0)" filter="url(#pill-shadow)">
      <rect width="280" height="120" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
      <g transform="translate(20, 25)">
        <!-- Cloud icon -->
        <rect x="0" y="0" width="36" height="36" rx="8" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
        <path d="M 12 24 A 5 5 0 0 1 12 18 A 6 6 0 0 1 23 15 A 5 5 0 0 1 26 24 Z" fill="#38bdf8" />
        <text x="48" y="17" class="badge-text">AWS Emulation</text>
        <text x="48" y="32" class="stat-label">Moto • floci • MiniStack</text>
      </g>
      <text x="20" y="86" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Wire-protocol drop-ins, mock</text>
      <text x="20" y="103" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">backends &amp; multi-account isolation</text>
    </g>

    <!-- Card 2: Azure Emulation -->
    <g class="card-float-2" transform="translate(330, 0)" filter="url(#pill-shadow)">
      <rect width="280" height="120" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
      <g transform="translate(20, 25)">
        <!-- Server/Storage icon -->
        <rect x="0" y="0" width="36" height="36" rx="8" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-width="1" />
        <path d="M 10 14 L 26 14 M 10 18 L 26 18 M 10 22 L 26 22" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
        <text x="48" y="17" class="badge-text">Azure &amp; GCP Stacks</text>
        <text x="48" y="32" class="stat-label">Azurite • floci-gcp • localgcp</text>
      </g>
      <text x="20" y="86" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Storage blobs, Pub/Sub, Firestore</text>
      <text x="20" y="103" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">&amp; local AI model backends</text>
    </g>

    <!-- Card 3: Multi-Cloud Emulation -->
    <g class="card-float-3" transform="translate(660, 0)" filter="url(#pill-shadow)">
      <rect width="280" height="120" rx="12" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
      <g transform="translate(20, 25)">
        <!-- Multi-node network icon -->
        <rect x="0" y="0" width="36" height="36" rx="8" fill="#9333ea" fill-opacity="0.25" stroke="#c084fc" stroke-width="1" />
        <circle cx="14" cy="18" r="3" fill="#c084fc" />
        <circle cx="24" cy="13" r="3" fill="#c084fc" />
        <circle cx="24" cy="23" r="3" fill="#c084fc" />
        <line x1="14" y1="18" x2="24" y2="13" stroke="#c084fc" stroke-width="1.5" />
        <line x1="14" y1="18" x2="24" y2="23" stroke="#c084fc" stroke-width="1.5" />
        <text x="48" y="17" class="badge-text">Multi-Cloud In-Memory</text>
        <text x="48" y="32" class="stat-label">cloudemu • S3Mock • ElasticMQ</text>
      </g>
      <text x="20" y="86" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Sub-millisecond fast test resets,</text>
      <text x="20" y="103" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">zero network latency &amp; CI-ready</text>
    </g>
  </g>

  <!-- Modern bottom line accent -->
  <line x1="200" y1="395" x2="1000" y2="395" stroke="url(#title-grad)" stroke-width="1.5" opacity="0.6" />
</svg>
